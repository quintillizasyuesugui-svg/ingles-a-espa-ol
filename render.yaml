services:
  - type: web
    name: traductor-voz
    env: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "from transformers import MarianMTModel, MarianTokenizer; m='Helsinki-NLP/opus-mt-es-en'; MarianTokenizer.from_pretrained(m); MarianMTModel.from_pretrained(m)"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
